name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff · mypy strict · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 3.13 is what [tool.mypy] type-checks against; the package needs >=3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Dev tooling is not declared in pyproject, so it is pinned here instead of
      # floating: a lint rule added upstream should not turn this badge red on a
      # commit that changed nothing.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.3,<10" "ruff==0.16.2" "mypy==2.3.0"

      - name: Lint
        run: ruff check .

      - name: Type-check (strict)
        run: mypy crucible

      - name: Test
        run: pytest -q
